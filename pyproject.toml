[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maharashtra-renewable-energy-site-finder"
version = "1.0.0"
description = "Spatial Decision Support System for Utility-Scale Solar and Wind Siting across Maharashtra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pillow>=10.0.0"
]

[tool.setuptools]
py-modules = ["server"]
